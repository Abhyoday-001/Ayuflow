
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayuflow-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayuflow}
      POSTGRES_USER: ${POSTGRES_USER:-ayuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayuflow_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayuflow} -d ${POSTGRES_DB:-ayuflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
